# Harness registry - agent backends the orchestrator knows how to drive.
# Candidate registry harness sections and run configs are validated against
# these IDs. Claude Code, Codex, OpenCode, Qwen Code, and zerocode (ZeroClaw)
# have runnable drivers.

harnesses:
  - id: claude-code
    name: Claude Code
    driver: claude-code
    defaultVersion: 2.1.170

  # OpenAI Codex CLI — model-agnostic (configure model/provider per worker
  # profile). Headless via `codex exec --json`. Re-pin defaultVersion at impl.
  # Codex reports tokens but no billed USD → cost is profile-priced/tokens-only.
  - id: codex
    name: Codex CLI
    driver: codex
    defaultVersion: 0.50.0
    reportsCost: false

  # OpenCode (opencode.ai) — model-agnostic terminal coding agent. Headless via
  # `opencode run --format json` (NDJSON events); ids are models.dev
  # `provider/model` (the driver prefixes bare claude-*/gpt-* ids). Emits
  # per-step USD cost → reportsCost stays true.
  - id: opencode
    name: OpenCode
    driver: opencode
    defaultVersion: 2.2.5

  # Qwen Code — Gemini-CLI fork from Alibaba, driven headlessly with
  # `qwen -p ... --output-format stream-json --yolo`. OpenAI-compatible auth
  # (OPENAI_API_KEY + OPENAI_BASE_URL from the model profile). Reports tokens
  # but no billed USD → cost is profile-priced/tokens-only.
  - id: qwen-code
    name: Qwen Code
    driver: qwen-code
    defaultVersion: 0.26.4
    reportsCost: false

  # ZeroClaw (zerocode) — Rust agent runtime; driven headlessly per trial via
  # `zeroclaw acp` (JSON-RPC 2.0 over stdio), one ACP turn per session step.
  # Auth is a ZeroClaw profile: the Claude Max subscription token (verified
  # v0.8.1 — true Opus parity with Claude Code, no API spend) or an API key.
  # ZeroClaw reports usage but no billed USD → cost is profile-priced/tokens-only,
  # never harness-reported.
  - id: zerocode
    name: zerocode (ZeroClaw)
    driver: zerocode
    defaultVersion: 0.8.1
    reportsCost: false
