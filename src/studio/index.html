<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Default tab title before React mounts; frontend.tsx then refines it to
		     "CodingHarness — <page>" per route. -->
		<title>CodingHarness</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"
		/>
		<link rel="stylesheet" href="./index.css" />
		<!-- studio-theming: resolve + apply the theme before first paint so the
		     page never flashes the wrong palette. Mirrors frontend.tsx's logic. -->
		<script>
			(() => {
				try {
					const t = localStorage.getItem("studio-theme") || "system";
					const dark =
						t === "dark" ||
						(t === "system" &&
							matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch (_) {}
			})();
		</script>
	</head>
	<body>
		<!--
		THESIS: An eval dashboard that reads like Linear and Vercel: one sidebar, one page header, a chart above a table. It refuses the stacked-cards-and-badges dashboard where nothing leads.
		OWN-WORLD: Neutral cool greys, one blue accent for data marks and the primary action, semantic green/amber/red only for outcomes. Geist for UI, Geist Mono for every machine value. 1px borders, 8px radius, no decorative shadows.
		STORY: The operator sees who leads and whether that lead is real, launches a run knowing its cost, opens a run as a trace to see where time and failures went, then drills to evidence.
		FIRST VIEWPORT: Sidebar left (nav + live run with budget bar); header "Leaderboard" with target/model and New run; a not-separable callout when the top two overlap; composite dot-range chart with its n; dimensions table with the weights strip at its foot.
		FORM: Category standard (standing exit), run detail as a trace waterfall; the direction roll is recorded in .impeccable/decision-r1.json.
		FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
		-->
		<div id="root"></div>
		<script type="module" src="./frontend.tsx"></script>
	</body>
</html>
